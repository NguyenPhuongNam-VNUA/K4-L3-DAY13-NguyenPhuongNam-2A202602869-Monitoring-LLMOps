alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95 > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: "@oncall-ai"
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 2m
    type: symptom-based
    channel: slack
    owner: "@oncall-ai"
    runbook: docs/alerts.md#alert-2
  - name: quality_or_retrieval_degraded
    severity: warning
    condition: quality_score_avg < 0.75 or retrieval_success_rate < 90
    duration: 5m
    type: symptom-based
    channel: slack
    owner: "@oncall-ai"
    runbook: docs/alerts.md#alert-3
